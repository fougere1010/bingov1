<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bingo Perso v5</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { padding: 1.5rem; background: #fff; color: #2C2C2A; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.title-input { font-size: 15px; font-weight: 500; background: none; border: none; border-bottom: 1px dashed #ccc; color: inherit; outline: none; max-width: 200px; }
.mode-btn { font-size: 12px; padding: 4px 10px; border: 0.5px solid #ccc; border-radius: 8px; background: none; color: #888; cursor: pointer; }
.mode-btn.active { background: #f1efe8; color: #2C2C2A; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
.tab { font-size: 12px; padding: 4px 12px; border: 0.5px solid #ccc; border-radius: 8px; background: #fff; color: #888; cursor: pointer; white-space: nowrap; }
.tab.active { background: #f1efe8; color: #2C2C2A; font-weight: 500; }
.tab-add { font-size: 18px; padding: 0 8px; border: 0.5px dashed #ccc; border-radius: 8px; background: none; color: #aaa; cursor: pointer; line-height: 26px; }

.stats { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 8px; font-size: 12px; }
.badge-pts    { background: #EEEDFE; color: #3C3489; font-weight: 500; }
.badge-bingo  { background: #E1F5EE; color: #085041; font-weight: 500; }
.badge-save   { background: #f1efe8; color: #aaa; font-size: 11px; }
.badge-deadline { font-size: 11px; padding: 3px 9px; border-radius: 8px; font-weight: 500; }
.badge-deadline.ok      { background: #E1F5EE; color: #085041; }
.badge-deadline.warn    { background: #FAEEDA; color: #633806; }
.badge-deadline.expired { background: #FCEBEB; color: #791F1F; }

.size-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.size-row label { font-size: 12px; color: #888; }

.deadline-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.deadline-row label { font-size: 12px; color: #888; }
.deadline-row input[type=datetime-local] { font-size: 12px; padding: 3px 8px; border: 0.5px solid #ccc; border-radius: 8px; background: #fff; color: #2C2C2A; }
.dl-clear { font-size: 11px; padding: 2px 8px; border: 0.5px solid #ccc; border-radius: 8px; background: none; color: #aaa; cursor: pointer; }

.drag-hint { font-size: 11px; color: #aaa; margin-bottom: 4px; }
.grid-wrap { overflow-x: auto; }
.bingo-grid { display: grid; gap: 5px; margin-bottom: 8px; }

.bingo-cell { border: 0.5px solid #ccc; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 4px; text-align: center; font-size: 11px; background: #fff; color: #2C2C2A; user-select: none; position: relative; transition: opacity 0.1s; }
.bingo-cell.expired-cell { opacity: 0.45; cursor: not-allowed; }
.bingo-cell.drag-over { border: 1.5px dashed #7F77DD; }
.bingo-cell input.cell-text { width: 100%; background: none; border: none; outline: none; text-align: center; font-size: 11px; color: inherit; }

.pts-badge { font-size: 9px; padding: 1px 4px; border-radius: 20px; background: rgba(0,0,0,0.07); margin-top: 2px; opacity: 0.8; }
.cell-dl { font-size: 9px; opacity: 0.65; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cell-dl.expired { opacity: 0.9; font-weight: 500; }
.check-mark { position: absolute; top: 3px; right: 4px; font-size: 9px; opacity: 0.6; }

.color-dot { width: 9px; height: 9px; border-radius: 50%; position: absolute; bottom: 3px; right: 3px; cursor: pointer; border: 0.5px solid rgba(0,0,0,0.12); }
.clock-dot { width: 9px; height: 9px; border-radius: 50%; position: absolute; bottom: 3px; left: 3px; cursor: pointer; background: #f1efe8; border: 0.5px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 7px; }
.clock-dot.has-dl    { background: #FAEEDA; border-color: rgba(239,159,39,0.33); }
.clock-dot.dl-expired { background: #FCEBEB; border-color: rgba(226,75,74,0.33); }

.picker-popup { position: absolute; bottom: 18px; right: 0; background: #fff; border: 0.5px solid #ccc; border-radius: 12px; padding: 6px 8px; z-index: 99; min-width: 160px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.picker-row { display: flex; align-items: center; gap: 6px; padding: 3px 4px; cursor: pointer; border-radius: 8px; }
.picker-row:hover { background: #f1efe8; }
.picker-swatch { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 0.5px solid rgba(0,0,0,0.1); }
.picker-label { font-size: 12px; color: #2C2C2A; flex: 1; }
.picker-pts { font-size: 11px; color: #888; }
.picker-row.selected .picker-label { font-weight: 500; }

.dl-edit-popup { position: absolute; bottom: 18px; left: 0; background: #fff; border: 0.5px solid #ccc; border-radius: 12px; padding: 8px 10px; z-index: 100; min-width: 210px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.dl-edit-popup label { font-size: 11px; color: #888; display: block; margin-bottom: 3px; }
.dl-edit-popup input[type=datetime-local] { font-size: 11px; padding: 3px 6px; border: 0.5px solid #ccc; border-radius: 8px; background: #fff; color: #2C2C2A; width: 100%; margin-bottom: 5px; }
.dl-edit-row { display: flex; gap: 5px; }
.dl-edit-row button { flex: 1; font-size: 11px; padding: 3px 0; cursor: pointer; border: 0.5px solid #ccc; border-radius: 8px; background: none; }

.legend-strip { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.legend-pill { display: flex; align-items: center; gap: 4px; font-size: 10px; padding: 2px 7px; border-radius: 20px; }

.action-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.action-row button { font-size: 12px; padding: 4px 12px; border: 0.5px solid #ccc; border-radius: 8px; background: none; cursor: pointer; }

.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #EEEDFE; color: #3C3489; padding: 7px 18px; border-radius: 12px; font-size: 13px; font-weight: 500; pointer-events: none; opacity: 0; transition: opacity 0.3s; border: 0.5px solid #AFA9EC; z-index: 200; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div style="padding: 1rem 0; max-width: 700px; margin: 0 auto;">

  <!-- Titre + modes -->
  <div class="topbar">
    <input class="title-input" id="bingoTitle" placeholder="Nom de la grille" oninput="renameGrid(this.value)" />
    <div style="display:flex;gap:6px;">
      <button class="mode-btn active" id="btnEdit" onclick="setMode('edit')">Editer</button>
      <button class="mode-btn"        id="btnPlay" onclick="setMode('play')">Jouer</button>
    </div>
  </div>

  <!-- Onglets grilles -->
  <div class="tabs" id="tabs"></div>

  <!-- Légende niveaux -->
  <div class="legend-strip" id="legendStrip"></div>

  <!-- Stats -->
  <div class="stats">
    <span class="badge badge-pts"      id="pointsBadge">0 pts</span>
    <span class="badge badge-bingo"    id="bingoBadge">0 bingo</span>
    <span class="badge badge-save"     id="saveBadge">sauvegardé</span>
    <span class="badge badge-deadline" id="gridDlBadge" style="display:none;"></span>
  </div>

  <!-- Contrôles taille (edit seulement) -->
  <div class="size-row" id="sizeRow">
    <label>Colonnes</label>
    <input type="range" min="2" max="8" id="colsRange" oninput="resizeGrid('cols',this.value)" style="width:90px;" />
    <span id="colsVal" style="font-size:12px;font-weight:500;min-width:14px;"></span>
    <label style="margin-left:8px;">Lignes</label>
    <input type="range" min="2" max="8" id="rowsRange" oninput="resizeGrid('rows',this.value)" style="width:90px;" />
    <span id="rowsVal" style="font-size:12px;font-weight:500;min-width:14px;"></span>
  </div>

  <!-- Deadline de la grille (edit seulement) -->
  <div class="deadline-row" id="gridDlRow">
    <label>Deadline grille</label>
    <input type="datetime-local" id="gridDlInput" onchange="setGridDeadline(this.value)" />
    <button class="dl-clear" onclick="clearGridDeadline()">Effacer</button>
  </div>

  <div class="drag-hint" id="dragHint"></div>

  <!-- Grille -->
  <div class="grid-wrap">
    <div class="bingo-grid" id="grid"></div>
  </div>

  <!-- Actions -->
  <div class="action-row">
    <button onclick="resetChecks()">Remettre à zéro</button>
    <button onclick="deleteGrid()" style="color:#791F1F;">Supprimer cette grille</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─── Niveaux de difficulté ─────────────────────────────────────────── */
const LEVELS = [
  { label:'Facile',     pts:5,  bg:'#E1F5EE', text:'#085041', dot:'#5DCAA5' },
  { label:'Normal',     pts:10, bg:'#E6F1FB', text:'#0C447C', dot:'#378ADD' },
  { label:'Difficile',  pts:20, bg:'#FAEEDA', text:'#633806', dot:'#EF9F27' },
  { label:'Extreme',    pts:40, bg:'#FAECE7', text:'#712B13', dot:'#D85A30' },
  { label:'Legendaire', pts:75, bg:'#EEEDFE', text:'#3C3489', dot:'#7F77DD' },
  { label:'Libre',      pts:10, bg:'#F1EFE8', text:'#444441', dot:'#888780' },
];

/* ─── État global ───────────────────────────────────────────────────── */
let grids = [], currentIdx = 0, mode = 'edit';
let openPicker = -1, openDlPicker = -1, dragSrc = -1;
let saveTimer = null, tickTimer = null;

/* ─── Données par défaut pour la première grille ────────────────────── */
const defLabels = [
  'Sport 30min','Lire 20p','Pas de sucre','Dormir 8h','Méditer',
  'Boire 2L eau','Appeler un ami','Ranger bureau','Marcher 10k','Cuisiner maison',
  'Pas de réseaux','Apprendre qqch','Faire du vélo','Journal intime','Sortir dehors',
  'Stretching','Nouvelle recette','Zéro achat','Lire un article','Pleine lune',
  '5 fruits/légumes','Sieste','Focus 2h','Gratitude x3','Bonne action'
];
const defLvls = [1,0,1,0,2, 1,0,2,1,3, 0,1,2,0,1, 2,1,0,1,2, 3,0,4,1,2];

/* ─── Création d'une grille vierge ──────────────────────────────────── */
function makeGrid(name, cols, rows) {
  const n = cols * rows;
  return {
    name, cols, rows, deadline: null,
    cells: Array.from({ length: n }, (_, i) => ({
      text:     defLabels[i] || '',
      checked:  false,
      levelIdx: defLvls[i] ?? 1,
      deadline: null,
    })),
    points: 0, bingoCount: 0, completedLines: [],
  };
}

/* ─── Persistance (localStorage) ────────────────────────────────────── */
function load() {
  try {
    const raw = localStorage.getItem('bingo_v5');
    if (raw) { const p = JSON.parse(raw); grids = p.grids; currentIdx = p.currentIdx || 0; mode = p.mode || 'edit'; return; }
  } catch(e) {}
  grids = [makeGrid('Mon bingo', 5, 5)];
  currentIdx = 0;
}
function save() {
  try { localStorage.setItem('bingo_v5', JSON.stringify({ grids, currentIdx, mode })); setSaveBadge('sauvegardé'); }
  catch(e) { setSaveBadge('erreur'); }
}
function scheduleSave() { setSaveBadge('...'); clearTimeout(saveTimer); saveTimer = setTimeout(save, 600); }
function setSaveBadge(t) { document.getElementById('saveBadge').textContent = t; }

/* ─── Raccourci grille courante ─────────────────────────────────────── */
function g() { return grids[currentIdx]; }

/* ─── Utilitaires date ──────────────────────────────────────────────── */
function now()         { return Date.now(); }
function parseDl(dl)   { return dl ? new Date(dl).getTime() : null; }
function fmtCountdown(ms) {
  if (ms <= 0) return 'Expiré';
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d > 0) return d + 'j ' + (h % 24) + 'h';
  if (h > 0) return h + 'h ' + (m % 60) + 'min';
  if (m > 0) return m + 'min ' + (s % 60) + 's';
  return s + 's';
}
function fmtDate(dl) {
  const d = new Date(dl);
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' })
       + ' ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
}
function dlStatus(dlTs) {
  if (!dlTs) return null;
  const diff = dlTs - now();
  if (diff <= 0)       return 'expired';
  if (diff < 3600000)  return 'warn';
  return 'ok';
}

/* ─── Rendu : onglets ───────────────────────────────────────────────── */
function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  grids.forEach((gr, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === currentIdx ? ' active' : '');
    let label = gr.name || ('Grille ' + (i + 1));
    const st = dlStatus(parseDl(gr.deadline));
    if (st === 'expired') label += ' ⏰';
    else if (st === 'warn') label += ' ⚡';
    btn.textContent = label;
    btn.onclick = () => { currentIdx = i; scheduleSave(); renderAll(); };
    tabs.appendChild(btn);
  });
  const add = document.createElement('button');
  add.className = 'tab-add'; add.title = 'Nouvelle grille'; add.textContent = '+';
  add.onclick = () => { grids.push(makeGrid('Grille ' + (grids.length + 1), 5, 5)); currentIdx = grids.length - 1; scheduleSave(); renderAll(); };
  tabs.appendChild(add);
}

/* ─── Rendu : légende niveaux ───────────────────────────────────────── */
function renderLegend() {
  const strip = document.getElementById('legendStrip');
  strip.innerHTML = '';
  LEVELS.forEach(lv => {
    const pill = document.createElement('div');
    pill.className = 'legend-pill';
    pill.style.background = lv.bg; pill.style.color = lv.text;
    pill.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${lv.dot};display:inline-block;flex-shrink:0;"></span><span>${lv.label} ${lv.pts}pts</span>`;
    strip.appendChild(pill);
  });
}

/* ─── Rendu : badge deadline grille ─────────────────────────────────── */
function renderGridDeadline() {
  const dlTs = parseDl(g().deadline);
  const st   = dlStatus(dlTs);
  const badge = document.getElementById('gridDlBadge');
  if (!dlTs) { badge.style.display = 'none'; return; }
  badge.style.display = '';
  badge.className = 'badge badge-deadline ' + (st || 'ok');
  const diff = dlTs - now();
  badge.textContent = diff <= 0 ? 'Grille expirée' : 'Grille : ' + fmtCountdown(diff);
}

/* ─── Rendu : contrôles (sliders, deadline grille) ──────────────────── */
function renderControls() {
  document.getElementById('bingoTitle').value   = g().name;
  document.getElementById('colsRange').value    = g().cols;
  document.getElementById('rowsRange').value    = g().rows;
  document.getElementById('colsVal').textContent = g().cols;
  document.getElementById('rowsVal').textContent = g().rows;
  const isEdit = mode === 'edit';
  document.getElementById('sizeRow').style.display   = isEdit ? 'flex' : 'none';
  document.getElementById('gridDlRow').style.display  = isEdit ? 'flex' : 'none';
  document.getElementById('gridDlInput').value        = g().deadline || '';
  document.getElementById('dragHint').textContent     = isEdit
    ? 'Glissez-déposez les cases pour les interchanger. Cliquez sur l\'horloge ⏱ pour une deadline par case.' : '';
  document.getElementById('btnEdit').classList.toggle('active', mode === 'edit');
  document.getElementById('btnPlay').classList.toggle('active', mode === 'play');
}

/* ─── Rendu : stats (pts, bingo, deadline) ──────────────────────────── */
function renderStats() {
  document.getElementById('pointsBadge').textContent = g().points + ' pts';
  document.getElementById('bingoBadge').textContent  = g().bingoCount + ' bingo';
  renderGridDeadline();
}

/* ─── Taille des cases selon nb colonnes ────────────────────────────── */
function cellSize(cols) {
  if (cols <= 4) return 78; if (cols <= 5) return 70;
  if (cols <= 6) return 62; if (cols <= 7) return 56;
  return 50;
}

/* ─── Rendu : grille ────────────────────────────────────────────────── */
function renderGrid() {
  const grid = document.getElementById('grid');
  const cs   = cellSize(g().cols);
  grid.style.gridTemplateColumns = `repeat(${g().cols}, ${cs}px)`;
  grid.innerHTML = '';

  const gridDlTs  = parseDl(g().deadline);
  const gridExpired = gridDlTs && gridDlTs - now() <= 0;

  g().cells.forEach((cell, i) => {
    const lv         = LEVELS[cell.levelIdx];
    const inBingo    = isInBingoLine(i) && cell.checked;
    const cellDlTs   = parseDl(cell.deadline);
    const cellExpired = cellDlTs && cellDlTs - now() <= 0;
    const isExpired  = gridExpired || cellExpired;
    const bg         = cell.checked ? darken(lv.bg) : lv.bg;

    /* Conteneur de la case */
    const div = document.createElement('div');
    div.className = 'bingo-cell' + (isExpired && !cell.checked ? ' expired-cell' : '');
    div.style.cssText = `background:${bg};color:${lv.text};border-color:${cell.checked ? lv.dot + '99' : '#ccc'};${inBingo ? 'box-shadow:inset 0 0 0 1.5px #1D9E75;' : ''}min-height:${cs}px;`;
    div.draggable = mode === 'edit';
    div.dataset.idx = i;

    /* Coche */
    if (cell.checked) {
      const ck = document.createElement('span'); ck.className = 'check-mark'; ck.textContent = '✓'; div.appendChild(ck);
    }

    /* ── MODE ÉDITION ── */
    if (mode === 'edit') {
      div.addEventListener('dragstart', onDragStart);
      div.addEventListener('dragover',  onDragOver);
      div.addEventListener('drop',      onDrop);
      div.addEventListener('dragend',   onDragEnd);
      div.addEventListener('dragleave', e => e.currentTarget.classList.remove('drag-over'));

      /* Champ texte */
      const inp = document.createElement('input');
      inp.className = 'cell-text'; inp.value = cell.text; inp.placeholder = '+'; inp.style.color = lv.text;
      inp.addEventListener('input', e => { g().cells[i].text = e.target.value; scheduleSave(); });
      inp.addEventListener('blur',  () => { if (openPicker !== i && openDlPicker !== i) renderGrid(); });
      div.appendChild(inp);

      /* Badge points */
      const pb = document.createElement('div'); pb.className = 'pts-badge'; pb.textContent = lv.pts + ' pts'; div.appendChild(pb);

      /* Affichage deadline case */
      if (cell.deadline) {
        const dlLine = document.createElement('div');
        dlLine.className = 'cell-dl' + (cellExpired ? ' expired' : '');
        dlLine.textContent = (cellExpired ? '⏰ ' : '') + fmtDate(cell.deadline);
        div.appendChild(dlLine);
      }

      /* Bouton horloge (deadline case) */
      const clockDot = document.createElement('div');
      clockDot.className = 'clock-dot' + (cellDlTs ? (cellExpired ? ' dl-expired' : ' has-dl') : '');
      clockDot.title = 'Deadline de la case'; clockDot.textContent = '⏱';
      clockDot.onclick = e => { e.stopPropagation(); openDlPicker = openDlPicker === i ? -1 : i; openPicker = -1; renderGrid(); };
      div.appendChild(clockDot);

      /* Popup deadline case */
      if (openDlPicker === i) {
        const popup = document.createElement('div'); popup.className = 'dl-edit-popup';
        const lbl = document.createElement('label'); lbl.textContent = 'Deadline pour cette case'; popup.appendChild(lbl);
        const dti = document.createElement('input'); dti.type = 'datetime-local'; dti.value = cell.deadline || ''; popup.appendChild(dti);
        const row = document.createElement('div'); row.className = 'dl-edit-row';
        const ok  = document.createElement('button'); ok.textContent = 'OK';
        ok.onclick  = e => { e.stopPropagation(); g().cells[i].deadline = dti.value || null; openDlPicker = -1; scheduleSave(); renderGrid(); };
        const clr = document.createElement('button'); clr.textContent = 'Effacer';
        clr.onclick = e => { e.stopPropagation(); g().cells[i].deadline = null; openDlPicker = -1; scheduleSave(); renderGrid(); };
        row.appendChild(ok); row.appendChild(clr); popup.appendChild(row);
        div.appendChild(popup); div.style.zIndex = 10;
      }

      /* Bouton couleur / niveau */
      const colorDot = document.createElement('div');
      colorDot.className = 'color-dot';
      colorDot.style.cssText = `background:${lv.dot};border-color:${lv.text}44;`;
      colorDot.onclick = e => { e.stopPropagation(); openPicker = openPicker === i ? -1 : i; openDlPicker = -1; renderGrid(); };
      div.appendChild(colorDot);

      /* Popup couleur / niveau */
      if (openPicker === i) {
        const popup = document.createElement('div'); popup.className = 'picker-popup';
        LEVELS.forEach((l, li) => {
          const row = document.createElement('div');
          row.className = 'picker-row' + (li === cell.levelIdx ? ' selected' : '');
          row.innerHTML = `<div class="picker-swatch" style="background:${l.dot}"></div><span class="picker-label">${l.label}</span><span class="picker-pts">${l.pts} pts</span>`;
          row.onclick = e => { e.stopPropagation(); g().cells[i].levelIdx = li; openPicker = -1; scheduleSave(); renderGrid(); };
          popup.appendChild(row);
        });
        div.appendChild(popup); div.style.zIndex = 10;
      }

      div.onclick = e => {
        if (!e.target.classList.contains('color-dot') && !e.target.classList.contains('clock-dot')
          && !e.target.closest('.picker-popup') && !e.target.closest('.dl-edit-popup')) inp.focus();
      };

    /* ── MODE JEU ── */
    } else {
      const txt = document.createElement('div'); txt.style = 'font-size:11px;padding:0 2px;'; txt.textContent = cell.text || '—'; div.appendChild(txt);
      const pb  = document.createElement('div'); pb.className = 'pts-badge'; pb.textContent = lv.pts + ' pts'; div.appendChild(pb);

      if (cell.deadline) {
        const diff    = cellDlTs - now();
        const dlLine  = document.createElement('div');
        dlLine.className = 'cell-dl' + (cellExpired ? ' expired' : '');
        dlLine.textContent = cellExpired ? '⏰ Expiré' : fmtCountdown(diff);
        div.appendChild(dlLine);
      }

      div.onclick = () => {
        if (isExpired && !cell.checked) { showToast('Deadline dépassée !'); return; }
        toggle(i);
      };
    }

    grid.appendChild(div);
  });

  renderStats();
}

/* ─── Render complet ────────────────────────────────────────────────── */
function renderAll() { renderTabs(); renderLegend(); renderControls(); renderGrid(); }

/* ─── Ticker 1 s (countdown en temps réel) ──────────────────────────── */
function startTick() {
  clearInterval(tickTimer);
  tickTimer = setInterval(() => { renderStats(); renderGrid(); }, 1000);
}

/* ─── Drag & drop ───────────────────────────────────────────────────── */
function onDragStart(e) { dragSrc = parseInt(e.currentTarget.dataset.idx); e.dataTransfer.effectAllowed = 'move'; }
function onDragOver(e)  { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; document.querySelectorAll('.bingo-cell').forEach(c => c.classList.remove('drag-over')); e.currentTarget.classList.add('drag-over'); }
function onDrop(e) {
  e.preventDefault();
  const dest = parseInt(e.currentTarget.dataset.idx);
  if (dragSrc !== -1 && dest !== dragSrc) { const tmp = g().cells[dragSrc]; g().cells[dragSrc] = g().cells[dest]; g().cells[dest] = tmp; scheduleSave(); renderGrid(); }
  document.querySelectorAll('.bingo-cell').forEach(c => c.classList.remove('drag-over'));
}
function onDragEnd() { document.querySelectorAll('.bingo-cell').forEach(c => c.classList.remove('drag-over')); dragSrc = -1; }

/* ─── Logique bingo ─────────────────────────────────────────────────── */
function getLines() {
  const { cols, rows } = g(); const lines = [];
  for (let r = 0; r < rows; r++) lines.push(Array.from({ length: cols }, (_, c) => r * cols + c));
  for (let c = 0; c < cols; c++) lines.push(Array.from({ length: rows }, (_, r) => r * cols + c));
  if (cols === rows) {
    lines.push(Array.from({ length: cols }, (_, i) => i * cols + i));
    lines.push(Array.from({ length: cols }, (_, i) => i * cols + (cols - 1 - i)));
  }
  return lines;
}
function isInBingoLine(idx) { return g().completedLines.some(li => getLines()[li] && getLines()[li].includes(idx)); }
function checkBingos() {
  const lines = getLines(); const gr = g();
  lines.forEach((line, idx) => {
    const complete = line.every(i => gr.cells[i] && gr.cells[i].checked);
    const was      = gr.completedLines.includes(idx);
    const bonus    = line.reduce((s, i) => s + LEVELS[gr.cells[i].levelIdx].pts, 0);
    if (complete && !was)  { gr.completedLines.push(idx); gr.points += bonus; showToast('BINGO ! +' + bonus + ' pts !'); }
    if (!complete && was)  { gr.completedLines = gr.completedLines.filter(l => l !== idx); gr.points = Math.max(0, gr.points - bonus); }
  });
  gr.bingoCount = gr.completedLines.length;
}

/* ─── Actions utilisateur ───────────────────────────────────────────── */
function toggle(i) {
  const cell = g().cells[i]; if (!cell.text) return;
  cell.checked = !cell.checked;
  const pts = LEVELS[cell.levelIdx].pts;
  g().points = Math.max(0, g().points + (cell.checked ? pts : -pts));
  checkBingos(); scheduleSave(); renderGrid();
  if (cell.checked) showToast('+' + pts + ' pts !');
}

function resizeGrid(dim, val) {
  const gr = g(); const v = parseInt(val);
  document.getElementById(dim === 'cols' ? 'colsVal' : 'rowsVal').textContent = v;
  if (dim === 'cols') gr.cols = v; else gr.rows = v;
  const newN = gr.cols * gr.rows;
  while (gr.cells.length < newN) gr.cells.push({ text:'', checked:false, levelIdx:1, deadline:null });
  gr.cells = gr.cells.slice(0, newN);
  gr.completedLines = []; gr.points = 0; gr.bingoCount = 0;
  scheduleSave(); renderGrid();
}

function renameGrid(v)       { g().name = v; renderTabs(); scheduleSave(); }
function setGridDeadline(v)  { g().deadline = v || null; scheduleSave(); renderAll(); }
function clearGridDeadline() { g().deadline = null; document.getElementById('gridDlInput').value = ''; scheduleSave(); renderAll(); }

function resetChecks() {
  const gr = g(); gr.cells.forEach(c => c.checked = false); gr.points = 0; gr.bingoCount = 0; gr.completedLines = [];
  scheduleSave(); renderGrid();
}
function deleteGrid() {
  if (grids.length === 1) { showToast('Il faut au moins une grille !'); return; }
  grids.splice(currentIdx, 1); currentIdx = Math.max(0, currentIdx - 1); scheduleSave(); renderAll();
}
function setMode(m) { mode = m; openPicker = -1; openDlPicker = -1; scheduleSave(); renderAll(); }

/* ─── Utilitaires visuels ───────────────────────────────────────────── */
function darken(hex) {
  const r = parseInt(hex.slice(1,3),16), g2 = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r*.87)},${Math.round(g2*.87)},${Math.round(b*.87)})`;
}
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

/* ─── Fermeture des popups au clic extérieur ────────────────────────── */
document.addEventListener('click', e => {
  if (openPicker   !== -1 && !e.target.closest('.bingo-cell')) { openPicker   = -1; renderGrid(); }
  if (openDlPicker !== -1 && !e.target.closest('.bingo-cell')) { openDlPicker = -1; renderGrid(); }
});

/* ─── Init ──────────────────────────────────────────────────────────── */
load();
renderAll();
startTick();
</script>
</body>
